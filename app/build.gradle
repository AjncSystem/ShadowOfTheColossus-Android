plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.ajncsystem.sotc'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'io.github.ajncsystem.sotc'
        minSdk 31
        targetSdk 36
        versionCode 77
        versionName '0.77'

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.31.5'
        }
    }

    sourceSets {
        main {
            // SDL3's Java glue (SDLActivity & co.) is used straight from the submodule.
            java.srcDirs += ['../externals/SDL/android-project/app/src/main/java']
            // Default GPU driver packages (adrenotools .zip) shipped inside the APK.
            assets.srcDirs += ['../drivers']
        }
    }

    packaging {
        jniLibs {
            // adrenotools loads its hook libraries from nativeLibraryDir, so the .so files
            // must be extracted on install.
            useLegacyPackaging true
        }
    }

    androidResources {
        // Driver zips are opened with ZipInputStream; keep them uncompressed in the APK.
        noCompress 'zip'
    }

    buildTypes {
        debug {
            jniDebuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
